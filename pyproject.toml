[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tonyfeel"
version = "0.1.0"
description = "Apply measured drummer pocket to quantized MIDI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tony Bollas" }]
keywords = ["midi", "drums", "groove", "microtiming", "feel"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "numpy>=1.24",
  "mido>=1.3",
]

[project.optional-dependencies]
extract = [
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "numba>=0.59",
  "beat-this>=1.0",
  "torch",
  "torchaudio",
]
demucs = ["demucs>=4.0"]
space = ["gradio>=4.0"]
all = ["tonyfeel[extract,demucs,space]"]

[project.scripts]
tonyfeel = "tonyfeel.cli:main"

[project.urls]
Homepage = "https://github.com/Toe333/tonyfeel"
Space = "https://huggingface.co/spaces/Toe333/tonyfeel"

[tool.setuptools.packages.find]
where = ["src"]
